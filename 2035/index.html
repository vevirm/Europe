<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>2035 · EU Economic Security Radar</title>
<link rel="stylesheet" href="../radar.css?v=28.4"><link rel="stylesheet" href="scenarios.css?v=4">
<script src="../radar_data.js?v=28.1"></script>
</head><body>
<main class="wrap future-main">
<section class="axis-pair-intro" aria-labelledby="axisPairTitle"><p class="taxonomy-kicker">2035 economic-security scenario spaces</p><h1 id="axisPairTitle">Choose an axis pair</h1><p class="future-lede">Four different pairs of security uncertainties open four different views of Europe in 2035. Each axis pair leads to 4 scenarios, and each scenario has 4 findings-driven variants.</p></section>
<div id="axisLensGrid" class="axis-lens-grid"><p class="empty">Loading</p></div>
</main>
<script>
const clean=v=>String(v||'').replace(/\s+/g,' ').trim();
const esc=v=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const data=await RadarData.load('../radar.json','../radar_seed.json');const frames=data?.high_order_inference?.scenarios_2035?.frames||[];document.getElementById('axisLensGrid').innerHTML=frames.map((f,i)=>`<article class="axis-lens-card"><a href="lens/?frame=${encodeURIComponent(f.id)}"><p class="lens-number">0${i+1}</p><h2>${esc(f.title)}</h2><p>${esc(f.question)}</p><div class="lens-meta"><span>4 scenarios</span><span>4 variants each</span></div><strong>Explore this axis pair →</strong></a></article>`).join('')||'<p class="empty">Scenario lenses are unavailable.</p>';}catch(e){console.error(e);document.getElementById('axisLensGrid').innerHTML='<p class="empty">Scenario lenses are unavailable.</p>';}})();
</script><script src="../site-shell.js?v=28.1"></script></body></html>
