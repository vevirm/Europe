<section class="scenario-hero"><p class="coords">Deep capacity / more buffers · More fragmented / guarded</p><h1>Independent Scale</h1><p class="scenario-tagline">Deep European capacity, but weaker global links.</p><p class="scenario-summary">Europe reaches 2035 with stronger industrial, technology and financing capacity, while trade and investment run through a narrower, more controlled set of relationships.</p><p class="scenario-tradeoff"><strong>Trade-off:</strong> Europe gains room to act, but pays for it through narrower access, higher friction and possible retaliation.</p></section>
<section aria-label="Sub-scenario matrix" class="scenario-frame sub-frame"><div class="frame-intro"><p class="taxonomy-kicker">What could make this world develop differently</p><h2>Inside Independent Scale</h2><p class="future-lede">Within this 2035 world, two uncertainties from the current Radar create four different paths: <strong>Control of critical technology</strong> and <strong>Industrial mobilisation</strong>.</p></div><div class="scenario-matrix-wrap"><div class="axis-y-high">Scaled production base</div><div class="axis-y-title">Industrial mobilisation</div><div class="scenario-matrix"><article class="scenario-cell sub-cell"><a href="#sub-1"><div><p class="cell-axis">Control of critical technology: Tech dependence · Industrial mobilisation: Scaled production</p><h2>Scaled production + Tech dependence</h2><p>Inside Independent Scale, this branch combines tech dependence with scaled production. The parent world's assumptions stay fixed; only these two second-order uncertainties are resolved differently.</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-2"><div><p class="cell-axis">Control of critical technology: Tech control · Industrial mobilisation: Scaled production</p><h2>Scaled production + Tech control</h2><p>Inside Independent Scale, this branch combines tech control with scaled production. The parent world's assumptions stay fixed; only these two second-order uncertainties are resolved differently.</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-3"><div><p class="cell-axis">Control of critical technology: Tech dependence · Industrial mobilisation: Thin production</p><h2>Thin production + Tech dependence</h2><p>Inside Independent Scale, this branch combines tech dependence with thin production. The parent world's assumptions stay fixed; only these two second-order uncertainties are resolved differently.</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-4"><div><p class="cell-axis">Control of critical technology: Tech control · Industrial mobilisation: Thin production</p><h2>Thin production + Tech control</h2><p>Inside Independent Scale, this branch combines tech control with thin production. The parent world's assumptions stay fixed; only these two second-order uncertainties are resolved differently.</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article></div><div class="axis-y-low">Thin production base</div><div class="axis-x"><b>Control of critical technology</b></div><div class="axis-x-labels"><span>External technology dependence</span><span>European technology control</span></div></div></section>
<section class="sub-details-intro"><p class="taxonomy-kicker">What could happen next</p><h2>Four ways each path could develop</h2><p>Each branch adds one current shock, opportunity, trend or risk from the Radar. They are illustrations of how the same underlying world could still unfold differently.</p></section>
<div class="sub-details"><section class="sub-detail" id="sub-1"><div class="sub-detail-head"><p class="sub-number">01</p><div><h3>Scaled production + Tech dependence</h3><p>Inside Independent Scale, this branch combines tech dependence with scaled production. The parent world's assumptions stay fixed; only these two second-order uncertainties are resolved differently.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>Shock inserted: War elsewhere could redraw the map public-sector AI capacity depends on</h4><p>What if “War elsewhere could redraw the map public-sector AI capacity depends on.” becomes a major external disruption? This scenario would face an immediate test.</p><p>The impact would depend on which protections remain effective as the system leans toward external technology dependence, while the system leans toward scaled production base.</p><p class="variant-source"><strong>Radar seed:</strong> Radar finding</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Opportunity inserted: Ukraine joins EU defence funding programmes</h4><p>Imagine “Ukraine joins EU defence funding programmes” creating a lasting opening. Europe could use it to improve its position.</p><p>Whether the opportunity lasts would depend partly on how investment and partnerships respond as the system leans toward external technology dependence, while the system leans toward scaled production base.</p><p class="variant-source"><strong>Radar seed:</strong> <a href="https://defence-industry-space.ec.europa.eu/ukraines-association-european-defence-fund-and-european-defence-industry-porgramme-funding-entered-2026-10-16_en" rel="noopener" target="_blank">European Commission — Defence Industry and Space · 2026-10-16</a></p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Trend accelerated: A stronger carbon market is necessary for a more competitive European industry</h4><p>A lasting shift along the lines of “A stronger carbon market is necessary for a more competitive European industry” would change the setting in which this scenario unfolds.</p><p>The long-term effects would accumulate as the system leans toward external technology dependence, while the system leans toward scaled production base.</p><p class="variant-source"><strong>Radar seed:</strong> <a href="https://www.cer.eu/sites/default/files/EC_ETS_2.7.26.pdf" rel="noopener" target="_blank">Centre for European Reform · 2026-07-02</a></p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Risk crystallises: Europe faces coercion risks alongside industrial competitiveness pressure</h4><p>If the vulnerability associated with “Europe faces coercion risks alongside industrial competitiveness pressure” deepens, today's exposure could become a structural constraint.</p><p>With the system leans toward external technology dependence, while the system leans toward scaled production base, the cost could appear in reduced choice, slower adjustment or greater dependence.</p><p class="variant-source"><strong>Radar seed:</strong> <a href="https://www.ispionline.it/wp-content/uploads/2026/09/ISPI-POLICY-PAPER-2026-ISPI-Study-for-AHK-Italien-2.pdf" rel="noopener" target="_blank">ISPI · 2026-09-15</a></p></article></div></section><section class="sub-detail" id="sub-2"><div class="sub-detail-head"><p class="sub-number">02</p><div><h3>Scaled production + Tech control</h3><p>Inside Independent Scale, this branch combines tech control with scaled production. The parent world's assumptions stay fixed; only these two second-order uncertainties are resolved differently.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>Shock inserted: A Primary-Data Scope 3 Carbon and Water Footprint Inventory of the Bangladesh R…</h4><p>What if “A Primary-Data Scope 3 Carbon and Water Footprint Inventory of the Bangladesh Ready-Made Garment Sector: Modelling Export-Competitiveness Exposure Under the European Union Carbon Border Adjustment Mechanism” becomes a major external disruption? This scenario would face an immediate test.</p><p>The impact would depend on which protections remain effective as the system leans toward european technology control, while the system leans toward scaled production base.</p><p class="variant-source"><strong>Radar seed:</strong> <a href="https://doi.org/10.1007/s42943-026-00166-9" rel="noopener" target="_blank">International Journal of Global Business and Competitiveness · 2026-09-23</a></p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Opportunity inserted: European warfare without US support</h4><p>If the opening suggested by “European warfare without US support” grows, Europe could gain room to act in this world.</p><p>With the system leans toward european technology control, while the system leans toward scaled production base, the opening could change who is able to invest, supply or cooperate.</p><p class="variant-source"><strong>Radar seed:</strong> <a href="https://doi.org/10.1080/00396338.2026.2678691" rel="noopener" target="_blank">Survival · 2026-05-04</a></p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Trend accelerated: Proposal for a Regulation on establishing a framework of measures for accelerat…</h4><p>If the development signalled by “Proposal for a Regulation on establishing a framework of measures for accelerating industrial capacity and decarbonisation in strategic sectors (Industrial Accelerator Act) -Guidance for further work - Publications Office of the EU” continues to 2035, it could reshape everyday conditions in this world.</p><p>With the system leans toward european technology control, while the system leans toward scaled production base, that shift could reinforce this branch and make it harder to reverse.</p><p class="variant-source"><strong>Radar seed:</strong> <a href="https://op.europa.eu/o/opportal-service/download-handler?identifier=1d08d46d-dc23-11f1-8501-01aa75ed71a1&amp;format=pdf&amp;language=en&amp;productionSystem=cellar&amp;part=" rel="noopener" target="_blank">Publications Office of the EU · 2026-11-06</a></p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Risk crystallises: A bottleneck in industrial competitiveness could propagate into public-sector A…</h4><p>A persistent weakness behind “A bottleneck in industrial competitiveness could propagate into public-sector AI capacity.” could narrow Europe's options in this branch.</p><p>The consequences could grow as the system leans toward european technology control, while the system leans toward scaled production base, narrowing the scope for adjustment.</p><p class="variant-source"><strong>Radar seed:</strong> Radar finding</p></article></div></section><section class="sub-detail" id="sub-3"><div class="sub-detail-head"><p class="sub-number">03</p><div><h3>Thin production + Tech dependence</h3><p>Inside Independent Scale, this branch combines tech dependence with thin production. The parent world's assumptions stay fixed; only these two second-order uncertainties are resolved differently.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>Shock inserted: A sanctions round aimed elsewhere could land on European defence production cap…</h4><p>Suppose the pressure behind “A sanctions round aimed elsewhere could land on European defence production capacity.” escalates into a larger external shock. This world would have to respond quickly.</p><p>With the system leans toward external technology dependence, while the system leans toward thin production base, the shock would reveal which buffers hold and which dependencies break down.</p><p class="variant-source"><strong>Radar seed:</strong> Radar finding</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Opportunity inserted: Could defence-innovation funding ease a bottleneck in European defence producti…</h4><p>An upside emerges if “Could defence-innovation funding ease a bottleneck in European defence production capacity?” develops into a larger opportunity for Europe.</p><p>Here, the system leans toward external technology dependence, while the system leans toward thin production base. The gains would depend on who can turn this opening into action.</p><p class="variant-source"><strong>Radar seed:</strong> Radar finding</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Trend accelerated: The Chips Act 2 0 debate targets remaining semiconductor value-chain dependenci…</h4><p>A lasting shift along the lines of “The Chips Act 2 0 debate targets remaining semiconductor value-chain dependencies and stronger European production capacity vs The Council circulated options for defining EU and partner origin in proposed industrial procurement and subsidy…” would change the setting in which this scenario unfolds.</p><p>The long-term effects would accumulate as the system leans toward external technology dependence, while the system leans toward thin production base.</p><p class="variant-source"><strong>Radar seed:</strong> Radar finding</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Risk crystallises: How Europe could preserve a strategic battery industry</h4><p>A persistent weakness behind “How Europe could preserve a strategic battery industry” could narrow Europe's options in this branch.</p><p>The consequences could grow as the system leans toward external technology dependence, while the system leans toward thin production base, narrowing the scope for adjustment.</p><p class="variant-source"><strong>Radar seed:</strong> <a href="https://www.cer.eu/sites/default/files/RS_batteries_5.11.26.pdf" rel="noopener" target="_blank">Centre for European Reform · 2026-11-05</a></p></article></div></section><section class="sub-detail" id="sub-4"><div class="sub-detail-head"><p class="sub-number">04</p><div><h3>Thin production + Tech control</h3><p>Inside Independent Scale, this branch combines tech control with thin production. The parent world's assumptions stay fixed; only these two second-order uncertainties are resolved differently.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>Shock inserted: Sanctions could freeze the money and partners behind industry manufacturing cap…</h4><p>What if “Sanctions could freeze the money and partners behind industry manufacturing capacity.” becomes a major external disruption? This scenario would face an immediate test.</p><p>The impact would depend on which protections remain effective as the system leans toward european technology control, while the system leans toward thin production base.</p><p class="variant-source"><strong>Radar seed:</strong> Radar finding</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Opportunity inserted: EU Ukraine Drone Alliance</h4><p>An upside emerges if “EU Ukraine Drone Alliance” develops into a larger opportunity for Europe.</p><p>Here, the system leans toward european technology control, while the system leans toward thin production base. The gains would depend on who can turn this opening into action.</p><p class="variant-source"><strong>Radar seed:</strong> <a href="https://defence-industry-space.ec.europa.eu/eu-ukraine-drone-alliance_en" rel="noopener" target="_blank">European Commission — Defence Industry and Space · 2026-09-11</a></p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Trend accelerated: Enhancing competitiveness, sovereignty and security of the European Union in fr…</h4><p>If the development signalled by “Enhancing competitiveness, sovereignty and security of the European Union in frontier AI - Publications Office of… vs Expert input identifies insufficient compute and scale-up capital alongside European research strengths and external concentration” continues to 2035, it could reshape everyday conditions in this world.</p><p>With the system leans toward european technology control, while the system leans toward thin production base, that shift could reinforce this branch and make it harder to reverse.</p><p class="variant-source"><strong>Radar seed:</strong> Radar finding</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Risk crystallises: A bottleneck in econsec risk assessment could propagate into AI governance</h4><p>A persistent weakness behind “A bottleneck in econsec risk assessment could propagate into AI governance.” could narrow Europe's options in this branch.</p><p>The consequences could grow as the system leans toward european technology control, while the system leans toward thin production base, narrowing the scope for adjustment.</p><p class="variant-source"><strong>Radar seed:</strong> Radar finding</p></article></div></section></div></template><template id="manual-world-connected_growth">

ed differently.</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-4"><div><p class="cell-axis">Partner diversification: Diversified partners · Control of critical technology: Tech dependence</p><h2>Tech dependence + Diversified partners</h2><p>Inside Connected Growth, this branch combines diversified partners with tech dependence. The parent world's assumptions stay fixed; only these two second-order uncertainties are resolved differently.</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article></div><div class="axis-y-low">External technology dependence</div><div class="axis-x"><b>Partner diversification</b></div><div class="axis-x-labels"><span>Narrow / concentrated partners</span><span>Broad / diversified partners</span></div></div></section>

 the EU's Global Gateway Initiative (GG) has…</h4><p>A lasting shift along the lines of “Almost five years after its launch, the EU's Global Gateway Initiative (GG) has emerged as a… vs The EU–US Trade and Technology Council coordinated export controls, investment screening and resilient supply-chain work” would change the setting in which this scenario unfolds.</p><p>The long-term effects would accumulate as the system leans toward narrow / concentrated partners, while the system leans toward european technology control.</p><p class="variant-source"><strong>Radar seed:</strong> Radar finding</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Risk crystallises: Finding a bridge between Erga Omnes obligations and WTO agreements: the case of…</h4><p>If the vulnerability associated with “Finding a bridge between Erga Omnes obligations and WTO agreements: the case of human rights-based export controls on” deepens, today's exposure could become a structural constraint.</p><p>With the system leans toward narrow / concentrated partners, while the system leans toward european technology control, the cost could appear in reduced choice, slower adjustment or greater dependence.</p><p class="variant-source"><strong>Radar seed:</strong> <a href="https://doi.org/10.1093/hrlr/ngag015" rel="noopener" target="_blank">Human Rights Law Review · 2026-07-05</a></p></article></div></section><section class="sub-detail" id="sub-2"><div class="sub-detail-head"><p class="sub-number">02</p><div><h3>Tech control + Diversified partners</h3><p>Inside Connected Growth, this branch combines diversified partners with tech control. The parent world's assumptions stay fixed; only these two second-order uncertainties are resolved differently.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>Shock inserted: Toward South Korean-German cooperation in economic security</h4><p>Suppose the pressure behind “Toward South Korean-German cooperation in economic security” escalates into a larger external shock. This world would have to respond quickly.</p><p>With the system leans toward broad / diversified partners, while the system leans toward european technology control, the shock would reveal which buffers hold and which dependencies break down.</p><p class="variant-source"><strong>Radar seed:</strong> <a href="https://merics.org/en/comment/toward-south-korean-german-cooperation-economic-security" rel="noopener" target="_blank">MERICS · 2024-04-26</a></p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Opportunity inserted: EU trade agreements: a possible way through the market-access constraint</h4><p>If the opening suggested by “EU trade agreements: a possible way through the market-access constraint.” grows, Europe could gain room to act in this world.</p><p>With the system leans toward broad / diversified partners, while the system leans toward european technology control, the opening could change who is able to invest, supply or cooperate.</p><p class="variant-source"><strong>Radar seed:</strong> Radar finding</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Trend accelerated: Factsheet: EU-India Free Trade Agreement - Greece - Trade and Economic Security</h4><p>“Factsheet: EU-India Free Trade Agreement - Greece - Trade and Economic Security” could become a defining feature of this branch if its present direction persists.</p><p>Here, the system leans toward broad / diversified partners, while the system leans toward european technology control. A persistent trend could gradually lock in the prevailing direction.</p><p class="variant-source"><strong>Radar seed:</strong> <a href="https://news.google.com/rss/articles/CBMigwJBVV95cUxNTjdudkpUMnJ6V0h6ZjJIUFJPMm9aZmlteHVXdjFFS3JKRnBpRDRlazN4VHU5WG44Y1lKTWszRU5rZElVYU9pZi1vS3gxcnNYQ2s0aFlRNEFNeVJDTHM0QlVINkxRd0sxdXlOTUJtb1VYR0JLNTVRVXNYUjhjeWI4T2RMbk1Qb0xWZlVHR3VGMEJqT05mRlNmdVM2eVJUS3BqN3VRU0hEN1pCa2U5TkZtd3dOVjhNWE
