<div class="sub-details"><section class="sub-detail" id="sub-1"><div class="sub-detail-head"><p class="sub-number">01</p><div><h3>Capital at scale + Input exposure</h3><p>European banks and investors can finance new projects, but access to vital industrial materials remains concentrated abroad. Businesses have money to respond to shocks, yet new mines or processors cannot appear overnight. The challenge is to use abundant capital early enough to buy alternative capacity rather than simply bidding up prices in a crisis.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>Mineral restrictions trigger an expensive investment scramble</h4><p>In 2030 an overseas processor places new licences on a material essential to European electric motors. European firms can raise money, but competing emergency bids drive up input prices before new sources qualify. Some projects are accelerated, while factories that need material immediately still stop. By 2035 investors own more alternative processing capacity if policymakers made long-term contracts credible; otherwise the financial response has only transferred money abroad.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.erss.2026.105047" rel="noopener" target="_blank">Energy Research &amp; Social Science (2026-10-29)</a>; <a href="https://doi.org/10.1111/roie.70080" rel="noopener" target="_blank">Review of International Economics (2026-08-05)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Capital reaches partner-country processing before the next crisis</h4><p>European lenders and manufacturers jointly finance a processing facility in a trusted partner country, securing delivery rights and environmental oversight without requiring complete domestic replication. The project diversifies actual processing rather than merely shipping ore through a new port. After several years European factories can switch inputs when a dominant exporter restricts sales. The opportunity depends on local partners benefiting fairly and on real commercial output, not signed memoranda.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://egmontinstitute.be/angola-between-china-russia-and-the-west-elections-critical-minerals-and-regional-realignment/" rel="noopener" target="_blank">Egmont Institute (2026-06-23)</a>; <a href="https://doi.org/10.1016/j.resconrec.2026.109158" rel="noopener" target="_blank">Resources Conservation and Recycling (2026-09-19)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Foreign-owned factories multiply faster than European control</h4><p>Open markets attract large overseas investors who announce and build European battery plants. Local employment and output rise, and European carmakers enjoy shorter deliveries. Yet key software, upstream materials and ownership decisions remain outside the Union. This trend is economically useful while relationships are dependable, but it does not provide the same strategic freedom as control over fallback technology and multiple suppliers.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://rhg.com/research/autos-and-materials-strong-real-estate-making-a-comeback-q3-2026-update/" rel="noopener" target="_blank">Rhodium Group (2026-11-05)</a>; <a href="https://www.cer.eu/sites/default/files/RS_batteries_5.11.26.pdf" rel="noopener" target="_blank">Centre for European Reform (2026-11-05)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>A profitable local factory becomes leverage for its foreign owner</h4><p>A foreign investor controls essential production software in a European manufacturing plant. During a policy dispute the owner threatens to withhold upgrades while still offering to keep jobs if conditions are met. Governments hesitate to challenge the demand because replacement would take years. Investment screening and negotiated continuity rights could limit the exposure, but the risk exists even when workers and the physical facility are entirely European.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://rhg.com/research/autos-and-materials-strong-real-estate-making-a-comeback-q3-2026-update/" rel="noopener" target="_blank">Rhodium Group (2026-11-05)</a>; <a href="https://celis.institute/beyond-the-individual-transaction-risk-assessments-under-article-194-of-regulation-eu-2026-1386/#download-pdf" rel="noopener" target="_blank">CELIS Institute (2026-10-22)</a> · The 2035 development is hypothetical.</p></article></div></section><section class="sub-detail" id="sub-2"><div class="sub-detail-head"><p class="sub-number">02</p><div><h3>Capital at scale + Input resilience</h3><p>Europe attracts large investment and has better access to critical inputs, although technology and production still depend heavily on international suppliers. Openness provides multiple ways to build capacity. The decisive question is whether capital produces usable European alternatives and spreads across the Union, or mainly finances foreign-controlled facilities.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>A foreign AI service is withdrawn despite healthy physical supply</h4><p>A new overseas technology restriction cuts European institutions off from a key AI model. Batteries, electricity and industrial materials remain available, but banks and public services struggle with automated workflows. Well-funded organisations activate tested local or multi-provider substitutes; smaller bodies do not. The shock shows how digital access can remain a critical constraint after material diversification succeeds. It is conditional, not evidence that a systemic AI outage has already occurred.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://news.google.com/rss/articles/CBMiigFBVV95cUxPcFlSWTFNSXJsdm1ETFp6eS1IZkIwblpHZk55NS02TG9kQUVXNE1vUV9FajhDTVJTNkRFcnZpa3Z6V3JiWXd4WjVqU3BXMjZacFR3bVdudnJWdnR4RGJxU0FJTmFQMHBUbVkwdDdCQ09hZVVULVFENW1IVmxKSWd5WXJLeTJ6NWZNLVE?oc=5" rel="noopener" target="_blank">ECB (2026-10-01)</a>; <a href="https://data.consilium.europa.eu/doc/document/ST-10476-2026-ADD-23-REV-1/en/pdf" rel="noopener" target="_blank">Council of the European Union (2026-11-10)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Investment creates a genuinely tested European digital fallback</h4><p>Banking groups, European payment providers and institutional investors fund interoperable payment rails and AI services with enforceable switching rights. By 2035 users can move core functions when a foreign platform changes terms, without banning the global provider in normal times. The benefit requires adoption by merchants and public agencies, not only expensive infrastructure. Competition keeps the backup attractive enough to be maintained between crises.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://news.google.com/rss/articles/CBMirAFBVV95cUxQeG5NdWJWVk5uRzBhQmVubk5EMHptbUFseEktd285WGxRY241QjJJdVFHOHMwU25OSW5OTnY3UHJwWG5yRWNiZ3dKV2NfTFR6anRNaGxBenZZYlNDWjNISW9CRkFlenN6VzY1cjJ5NHQ2M21nOVplWDRnRlZKVUkxUW5YdVZSSXRsa003VlBrVmtqaVpkMXZ3bUxmZHktemNUWl9XLXdNaHo2SmVv?oc=5" rel="noopener" target="_blank">Reuters (2026-09-30)</a>; <a href="https://news.google.com/rss/articles/CBMiigFBVV95cUxPcFlSWTFNSXJsdm1ETFp6eS1IZkIwblpHZk55NS02TG9kQUVXNE1vUV9FajhDTVJTNkRFcnZpa3Z6V3JiWXd4WjVqU3BXMjZacFR3bVdudnJWdnR4RGJxU0FJTmFQMHBUbVkwdDdCQ09hZVVULVFENW1IVmxKSWd5WXJLeTJ6NWZNLVE?oc=5" rel="noopener" target="_blank">ECB (2026-10-01)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Diversified physical supply draws in a new industrial generation</h4><p>European manufacturers combine lower-risk mineral contracts with affordable international equipment, then use patient capital to build competitive product lines. Access to outside ideas remains a strength. Some firms gradually gain control of maintenance and design, but progress is uneven across Member States. The trend moves Europe closer to Connected Growth if new plants operate without permanent subsidies and financial benefits reach less wealthy regions.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13563467.2026.2676621" rel="noopener" target="_blank">New Political Economy (2026-05-25)</a>; <a href="https://doi.org/10.1016/j.resconrec.2026.109158" rel="noopener" target="_blank">Resources Conservation and Recycling (2026-09-19)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>A flood of funding favours the largest industrial regions</h4><p>Investors fund projects near existing rich-country clusters while smaller EU economies supply labour and buyers. Europe gains some aggregate resilience, but internal market disparities sharpen and political support weakens. Officials respond with competing national grants, increasing costs. This risk comes from uneven finance and industrial geography rather than a foreign embargo. Cross-border supplier rules and common investment vehicles could keep capital mobilisation from creating new European dependencies.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13563467.2026.2676621" rel="noopener" target="_blank">New Political Economy (2026-05-25)</a>; <a href="https://doi.org/10.1111/eulj.70030" rel="noopener" target="_blank">European Law Journal (2026-10-15)</a> · The 2035 development is hypothetical.</p></article></div></section><section class="sub-detail" id="sub-3"><div class="sub-detail-head"><p class="sub-number">03</p><div><h3>Capital constraint + Input exposure</h3><p>Europe lacks strong capital mobilisation and remains exposed to concentrated critical inputs, but global markets are mostly accessible. Consumers benefit from imports while domestic firms struggle to finance alternative capacity. A shock need not close all trade: changing prices or shifting other countries’ policies can be enough to expose the weak buffer.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>A tariff shock redirects products into a vulnerable EU sector</h4><p>In 2029 another large economy suddenly raises tariffs on a specialised manufactured product. Exporters redirect shipments into Europe, as research found for some products after earlier US tariffs. European buyers enjoy lower prices, but domestic producers already short of investment lose orders. A broad EU import ban could then raise costs for other firms. The disruption becomes serious only if injury is concentrated and policymakers cannot target relief precisely.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.econlet.2026.113230" rel="noopener" target="_blank">Economics Letters (2026-09-15)</a>; <a href="https://doi.org/10.1038/s41560-026-02105-7" rel="noopener" target="_blank">Nature Energy (2026-07-10)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Trade agreements supply inexpensive alternatives without huge grants</h4><p>European importers use functioning provisions of several trade agreements to qualify new component suppliers and spread delivery risk. The strategy requires modest working capital, standards checks and freight planning rather than building every factory. It gives buyers more choice but cannot protect the small number of critical goods still controlled at one upstream stage. The opportunity is strongest when agreements move beyond diplomatic announcements into repeated commercial deliveries.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://op.europa.eu/o/opportal-service/download-handler?identifier=0f50df8f-ce36-11f1-9458-01aa75ed71a1&amp;format=pdf&amp;language=en&amp;productionSystem=cellar&amp;part=" rel="noopener" target="_blank">Publications Office of the EU (2026-10-22)</a>; <a href="https://egmontinstitute.be/india-eu-strategic-partnership-still-a-long-way-to-go/" rel="noopener" target="_blank">Egmont Institute (2026-11-03)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>European companies become global integrators instead of major producers</h4><p>Firms retain skills in logistics, quality control and high-value product integration while importing more of the physical components. Profits and consumer choice can remain healthy in an open world. But shrinking domestic manufacturing and thin investment make it harder to restart production later. The trend is a genuine trade-off, not automatic decline: prosperity survives until a strategic input is withheld at a point where no qualified alternative exists.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1111/roie.70080" rel="noopener" target="_blank">Review of International Economics (2026-08-05)</a>; <a href="https://doi.org/10.1080/13563467.2026.2751103" rel="noopener" target="_blank">New Political Economy (2026-10-28)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>A customs re-routing becomes a new single point of failure</h4><p>A company replaces one risky exporter with an intermediary in another country, believing it diversified. The intermediary buys from the same original processor and adds transport complexity. When the source restricts sales, both apparent supply routes fail and the European buyer lacks finance to qualify a new one. The risk grows because procurement reports count countries of shipment rather than production and ownership. Supplier tracing is a lower-cost defence than a huge emergency subsidy.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.erss.2026.105047" rel="noopener" target="_blank">Energy Research &amp; Social Science (2026-10-29)</a>; <a href="https://egmontinstitute.be/angola-between-china-russia-and-the-west-elections-critical-minerals-and-regional-realignment/" rel="noopener" target="_blank">Egmont Institute (2026-06-23)</a> · The 2035 development is hypothetical.</p></article></div></section><section class="sub-detail" id="sub-4"><div class="sub-detail-head"><p class="sub-number">04</p><div><h3>Capital constraint + Input resilience</h3><p>Europe has developed some protection against critical-input shortages but struggles to mobilise money for further industrial growth. Connected trade supplies affordable finished products and technology, while weak investment means domestic alternatives remain limited. The world is manageable when markets function and more fragile when a service, credit or infrastructure network fails.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>A payment-system failure interrupts otherwise plentiful imports</h4><p>In 2033 a major foreign payment service experiences a severe multi-day outage. European buyers can source materials from several countries, but some shipments stop because firms cannot settle invoices or verify payments. A European backup network helps only where merchants have adopted it. The shock makes clear that physical diversification does not guarantee financial continuity. Small exporters with little working capital are hit hardest; faster switching and emergency settlement arrangements reduce the damage.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://news.google.com/rss/articles/CBMirAFBVV95cUxQeG5NdWJWVk5uRzBhQmVubk5EMHptbUFseEktd285WGxRY241QjJJdVFHOHMwU25OSW5OTnY3UHJwWG5yRWNiZ3dKV2NfTFR6anRNaGxBenZZYlNDWjNISW9CRkFlenN6VzY1cjJ5NHQ2M21nOVplWDRnRlZKVUkxUW5YdVZSSXRsa003VlBrVmtqaVpkMXZ3bUxmZHktemNUWl9XLXdNaHo2SmVv?oc=5" rel="noopener" target="_blank">Reuters (2026-09-30)</a>; <a href="https://news.google.com/rss/articles/CBMiigFBVV95cUxPcFlSWTFNSXJsdm1ETFp6eS1IZkIwblpHZk55NS02TG9kQUVXNE1vUV9FajhDTVJTNkRFcnZpa3Z6V3JiWXd4WjVqU3BXMjZacFR3bVdudnJWdnR4RGJxU0FJTmFQMHBUbVkwdDdCQ09hZVVULVFENW1IVmxKSWd5WXJLeTJ6NWZNLVE?oc=5" rel="noopener" target="_blank">ECB (2026-10-01)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Repair services become a low-capital route to resilience</h4><p>Rather than fund huge new factories, European cities and industries expand repair, testing and parts recovery for imported equipment. The service can employ local specialists and stretch scarce capital while lowering demand for single-source replacements. It does not solve dependence on proprietary tools, and buyers need enforceable maintenance access. By 2035 this opportunity preserves essential operations and some skilled work even without a broad production renaissance.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.jclepro.2026.149847" rel="noopener" target="_blank">Journal of Cleaner Production (2026-11-04)</a>; <a href="https://doi.org/10.1007/s40831-026-01716-4" rel="noopener" target="_blank">Journal of Sustainable Metallurgy (2026-10-23)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Recycled materials become dependable but not yet cheap</h4><p>Collection schemes and specialised processors turn more discarded European products into secondary material. Factories gain a partial domestic input buffer, while lack of patient financing keeps processing volumes modest. The trend reduces the bargaining leverage of a dominant supplier in particular components, not all minerals. It could accelerate if EU buyers commit to verified recovery contracts; alternatively it may remain a high-cost niche in an otherwise open economy.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.jclepro.2026.149847" rel="noopener" target="_blank">Journal of Cleaner Production (2026-11-04)</a>; <a href="https://doi.org/10.1016/j.resconrec.2026.109158" rel="noopener" target="_blank">Resources Conservation and Recycling (2026-09-19)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Import-led growth erodes the next generation of industrial skills</h4><p>Affordable foreign components keep European consumers supplied, but thin funding and few domestic production trials leave engineers unable to commercialise new designs. Firms that need scale-up capital relocate, taking intellectual property and suppliers with them. In a connected world, this can happen without any coercive act. The risk only reverses when European banks, customers and governments create enough sustained demand to make local production attractive on commercial terms.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://op.europa.eu/en/publication-detail/-/publication/4a76ba2c-c8fa-11f1-97f3-01aa75ed71a1/language-en" rel="noopener" target="_blank">European Court of Auditors (2026-10-15)</a>; <a href="https://www.businesseurope.eu/wp-content/uploads/2026/10/2026-10-27-Priorities-for-European-startups-and-scaleups.pdf" rel="noopener" target="_blank">BusinessEurope (2026-10-27)</a> · The 2035 development is hypothetical.</p></article></div></section></div></template></main>
