<section class="scenario-hero"><p class="coords">Deep capacity / more buffers · More fragmented / guarded</p><h1>Independent Scale</h1><p class="scenario-tagline">Stronger European capacity in a guarded world</p><p class="scenario-summary">By 2035 Europe has expanded factories, financing and essential public services, but international trade operates through guarded blocs and selective licences. Governments have deliberately paid for some spare capacity and joint purchasing. This future requires years of investment and enough political agreement to keep the single market working. It could be undermined by high costs or reopened trade routes. Europe can act without permission in more areas than today, yet its exports and access to outside ideas face friction.</p><p class="scenario-tradeoff"><strong>Core trade-off:</strong> Security is purchased with public money, narrower markets and difficult choices about which dependencies deserve domestic substitutes.</p></section>
<section aria-label="Sub-scenario matrix" class="scenario-frame sub-frame"><div class="frame-intro"><p class="taxonomy-kicker">What could make this world develop differently</p><h2>Inside Independent Scale</h2><p class="future-lede">This world draws on uneven state aid, mineral leverage, chip-chain weaknesses and emerging defence cooperation. It assumes Europe's additional capacity is operational—not merely promised—while major trading partners maintain restrictions. Internal paths ask whether factories truly scale and whether Europe controls the technology behind them.</p></div><div class="scenario-matrix-wrap"><div class="axis-y-high">Scaled production base</div><div class="axis-y-title">Industrial mobilisation</div><div class="scenario-matrix"><article class="scenario-cell sub-cell"><a href="#sub-1"><div><p class="cell-axis">Control of critical technology: Tech dependence · Industrial mobilisation: Scaled production</p><h2>Scaled production + Tech dependence</h2><p>European factories now make a wider range of essential goods, but many rely on foreign design software, equipment or licences. Capacity buffers soften ordinary shortages, while a single licence decision could still halt production. This path is stable only if trusted external access remains pre…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-2"><div><p class="cell-axis">Control of critical technology: Tech control · Industrial mobilisation: Scaled production</p><h2>Scaled production + Tech control</h2><p>European industry can produce and maintain key technology domestically and has enough scale to meet major EU orders. That combination creates real buffers, but fragmented world markets reduce export sales and encourage rivalry over public subsidies. The question becomes whether a larger Europea…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-3"><div><p class="cell-axis">Control of critical technology: Tech dependence · Industrial mobilisation: Thin production</p><h2>Thin production + Tech dependence</h2><p>Europe can maintain selected core technologies, but high-cost domestic production remains thin. In a guarded world it imports fewer goods cheaply and must choose which sectors deserve rare public money. Design rights offer bargaining power, yet lacking factory and repair capacity makes rapid re…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-4"><div><p class="cell-axis">Control of critical technology: Tech control · Industrial mobilisation: Thin production</p><h2>Thin production + Tech control</h2><p>Europe has relatively strong control of key technologies, but its factories cannot manufacture enough finished products. The original axes combine thin production with stronger technology control. Domestic knowledge is a defensive asset, yet industrial delivery is the weakness. Policymakers mus…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article></div><div class="axis-y-low">Thin production base</div><div class="axis-x"><b>Control of critical technology</b></div><div class="axis-x-labels"><span>External technology dependence</span><span>European technology control</span></div></div></section>
<section class="sub-details-intro"><p class="taxonomy-kicker">What could happen next</p><h2>Four ways each path could develop</h2><p>Each path keeps the world assumptions and its own two axes. The four variants below test a distinct hypothetical disruption, achievable opening, gradual development and risk. They are alternative conditions, not four things predicted to happen together.</p></section>
<div class="sub-details"><section class="sub-detail" id="sub-1"><div class="sub-detail-head"><p class="sub-number">01</p><div><h3>Scaled production + Tech dependence</h3><p>European factories now make a wider range of essential goods, but many rely on foreign design software, equipment or licences. Capacity buffers soften ordinary shortages, while a single licence decision could still halt production. This path is stable only if trusted external access remains predictable; Europe can choose suppliers more often than in 2026 but does not control the whole chain.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>A tool licence turns domestic chip scale into idle capacity</h4><p>In 2031 an overseas authority suspends updates for equipment used by several European fabs. The plants still have buildings and staff, but output falls as machines reach maintenance limits. Joint EU orders for alternative service suppliers help some sites continue. In 2035 Europe has learned that making chips locally does not equal owning every vital tool. If licences resume quickly, the disruption is temporary; if not, the investment case for independent servicing grows.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13563467.2026.2751102" rel="noopener" target="_blank">New Political Economy (2026-10-30)</a>; <a href="https://doi.org/10.1080/13501763.2026.2710717" rel="noopener" target="_blank">Journal of European Public Policy (2026-08-01)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Joint contracts unlock a second technology supply line</h4><p>After common purchasing agencies guarantee multi-year demand, equipment firms in several friendly countries qualify interchangeable components for European production lines. European factories can now change maintenance suppliers without rebuilding whole plants. This is an opportunity rather than an automatic benefit: public buyers must accept higher near-term testing costs and suppliers must exchange technical standards. In 2035 the gain is negotiating freedom, not full independence from international technology.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://data.consilium.europa.eu/doc/document/ST-15512-2026-INIT/en/pdf" rel="noopener" target="_blank">European Economic and Social Committee (2026-10-21)</a>; <a href="https://doi.org/10.1016/j.respol.2026.105657" rel="noopener" target="_blank">Research Policy (2026-10-29)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Protected factories expand, but their inputs stay global</h4><p>Strategic purchasing and grants sustain several European industrial clusters. Over time local suppliers train workers and reduce delivery delays, although specialist software and certain components still come from abroad. Export restrictions in guarded markets prevent some firms from reaching full scale. The trend therefore gives Europe resilience in a few strategic activities rather than an economy-wide return to national production. Its long-run test is whether factories can compete when public contracts end.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1111/eulj.70030" rel="noopener" target="_blank">European Law Journal (2026-10-15)</a>; <a href="https://doi.org/10.1080/13501763.2026.2710717" rel="noopener" target="_blank">Journal of European Public Policy (2026-08-01)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>A hidden licence dependency weakens Europe's bargaining power</h4><p>A European producer supplies a critical product to EU customers but cannot alter its design without approval from a foreign rights-holder. When security tensions rise, buyers discover that a domestic factory offers little negotiating freedom over updates. The risk accumulates because subsidies rewarded production volume rather than control of designs and repair rights. Europe could respond by contracting for transferable licences, but replacing decades of specialist knowledge would take longer than building a plant.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13563467.2026.2751102" rel="noopener" target="_blank">New Political Economy (2026-10-30)</a>; <a href="https://www.businesseurope.eu/wp-content/uploads/2026/10/2026-10-27-Priorities-for-European-startups-and-scaleups.pdf" rel="noopener" target="_blank">BusinessEurope (2026-10-27)</a> · The 2035 development is hypothetical.</p></article></div></section><section class="sub-detail" id="sub-2"><div class="sub-detail-head"><p class="sub-number">02</p><div><h3>Scaled production + Tech control</h3><p>European industry can produce and maintain key technology domestically and has enough scale to meet major EU orders. That combination creates real buffers, but fragmented world markets reduce export sales and encourage rivalry over public subsidies. The question becomes whether a larger European industrial base stays competitive without losing the international partnerships that helped create it.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>An external metals embargo tests an otherwise strong technology base</h4><p>In 2030 a mineral-processing authority unexpectedly restricts a specialised alloy needed by European motor and defence manufacturers. European plants own their designs and machines but cannot instantly make feedstock. Firms with recycled reserves keep production going; others pause despite their apparent autonomy. The episode shows that technology control is not raw-material control. By 2035 joint material standards have become as important as chip design, provided recovery plants can meet industrial quality.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.erss.2026.105047" rel="noopener" target="_blank">Energy Research &amp; Social Science (2026-10-29)</a>; <a href="https://doi.org/10.1016/j.jclepro.2026.149847" rel="noopener" target="_blank">Journal of Cleaner Production (2026-11-04)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>European secure components become exportable to trusted partners</h4><p>With its own industrial designs and reliable production, Europe offers repairable defence, grid and industrial components to partners outside rival trade blocs. Bilateral recognition of standards keeps some trade open despite fragmentation. The commercial gain funds further research and helps firms escape dependence on domestic subsidies. It requires negotiated access and transparent export controls; otherwise “strategic” restrictions could make European goods too difficult to buy.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://defence-industry-space.ec.europa.eu/ukraines-association-european-defence-fund-and-european-defence-industry-porgramme-funding-entered-2026-10-16_en" rel="noopener" target="_blank">European Commission — Defence Industry and Space (2026-10-16)</a>; <a href="https://doi.org/10.1080/13563467.2026.2751103" rel="noopener" target="_blank">New Political Economy (2026-10-28)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Shared specifications turn procurement into a production flywheel</h4><p>Member States agree common specifications for several high-value systems. Manufacturers invest because production runs can serve multiple buyers, and suppliers in smaller EU countries join the contracts. Over a decade unit costs fall in sectors where shared orders are large enough. This trend does not extend automatically to every industry: nationally preferred designs and small production volumes still resist scale. By 2035 success is measured in deliveries rather than budget headlines.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.respol.2026.105657" rel="noopener" target="_blank">Research Policy (2026-10-29)</a>; <a href="https://doi.org/10.1080/09662839.2026.2709844" rel="noopener" target="_blank">European Security (2026-09-09)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>National subsidy bidding divides a stronger EU industry</h4><p>Even with technological independence, wealthy Member States offer rival packages to attract the same next-generation factory. A few regions secure high-value jobs while others become component suppliers with little design power. The EU gains aggregate capacity but loses political trust and spends more than necessary. This risk emerges from unequal fiscal capacity, not foreign pressure. Common cofinancing and transparent economic tests could keep domestic scale from turning into single-market fragmentation.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13563467.2026.2676621" rel="noopener" target="_blank">New Political Economy (2026-05-25)</a>; <a href="https://doi.org/10.1111/eulj.70030" rel="noopener" target="_blank">European Law Journal (2026-10-15)</a> · The 2035 development is hypothetical.</p></article></div></section><section class="sub-detail" id="sub-3"><div class="sub-detail-head"><p class="sub-number">03</p><div><h3>Thin production + Tech dependence</h3><p>Europe can maintain selected core technologies, but high-cost domestic production remains thin. In a guarded world it imports fewer goods cheaply and must choose which sectors deserve rare public money. Design rights offer bargaining power, yet lacking factory and repair capacity makes rapid replacement difficult when foreign production falters.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>Closed freight routes expose Europe's shortage of production depth</h4><p>A prolonged border and shipping disruption stops a few critical imported components. European firms hold the relevant designs but have nowhere to manufacture certified replacements quickly. Industrial capacity is diverted from ordinary goods, raising prices even for activities outside the original crisis. The lesson of this 2035 branch is that intellectual property cannot substitute for equipment, trained workers and spare inventory. Regional production-sharing agreements reduce delays but cannot create capacity in weeks.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://op.europa.eu/o/opportal-service/download-handler?identifier=f135ce84-d8c8-11f1-8501-01aa75ed71a1&amp;format=pdf&amp;language=en&amp;productionSystem=cellar&amp;part=" rel="noopener" target="_blank">European Environment Agency (2026-11-03)</a>; <a href="https://doi.org/10.1080/13501763.2026.2710717" rel="noopener" target="_blank">Journal of European Public Policy (2026-08-01)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Regional repair hubs make thin factories more useful</h4><p>Instead of funding whole new industries, EU states jointly build repair, testing and component-refurbishment centres around existing plants. They use controlled designs to keep equipment functioning longer while imported new units are scarce. This is a modest but achievable gain: the hubs must secure spare parts, skills and cross-border certification. By 2035 Europe remains production-constrained but can absorb shorter shocks without completely replacing a global supply chain.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13563467.2026.2751110" rel="noopener" target="_blank">New Political Economy (2026-10-28)</a>; <a href="https://doi.org/10.1016/j.ocecoaman.2026.108355" rel="noopener" target="_blank">Ocean &amp; Coastal Management (2026-09-05)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>A service-and-design economy survives guarded trade</h4><p>Several European firms concentrate on valuable industrial software, qualification and maintenance while sourcing volume production from a limited set of partners. Exports of knowledge and high-value services help fund domestic research. The trend provides income without fully solving physical vulnerabilities. It would weaken if foreign countries forced local transfer of designs or if European customers insisted on locally made hardware. Europe remains capable in narrow functions, not comprehensively self-sufficient.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://news.google.com/rss/articles/CBMickFVX3lxTE9TSkhHTWExVWNYeHFvbHM5UnZMU1Fqdi1sU1g5WVRXX3V3ZzhPVWtXS21hRzRKVGZISjhSSVZnNG1aYUR3WVdIb2llbWNFRVVHb094QmUya19lLUFTZEdFbEowYWZ4SjJWV29fc0JpeFhWZw?oc=5" rel="noopener" target="_blank">European Commission / DG Research and Innovation (2026-10-01)</a>; <a href="https://www.businesseurope.eu/wp-content/uploads/2026/10/2026-10-27-Priorities-for-European-startups-and-scaleups.pdf" rel="noopener" target="_blank">BusinessEurope (2026-10-27)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Know-how drains away when production never follows</h4><p>Young specialists leave for regions where their designs can be fabricated and tested at scale. European universities and labs remain strong, but commercial decisions migrate with production contracts. Over time even domestic design control becomes less meaningful because the next generation of firms is built elsewhere. This is a gradual risk, not a sudden embargo; it can be reversed only by financing selected production trials and retaining competitive open markets where possible.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://op.europa.eu/en/publication-detail/-/publication/4a76ba2c-c8fa-11f1-97f3-01aa75ed71a1/language-en" rel="noopener" target="_blank">European Court of Auditors (2026-10-15)</a>; <a href="https://doi.org/10.1080/13501763.2026.2710717" rel="noopener" target="_blank">Journal of European Public Policy (2026-08-01)</a> · The 2035 development is hypothetical.</p></article></div></section><section class="sub-detail" id="sub-4"><div class="sub-detail-head"><p class="sub-number">04</p><div><h3>Thin production + Tech control</h3><p>Europe has relatively strong control of key technologies, but its factories cannot manufacture enough finished products. The original axes combine thin production with stronger technology control. Domestic knowledge is a defensive asset, yet industrial delivery is the weakness. Policymakers must decide how much capacity to build rather than merely protecting ideas.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>Power shortages halt a carefully protected technology niche</h4><p>A heat and drought emergency cuts grid capacity near European precision-engineering plants. The EU controls their designs and licences, but limited production sites cannot shift orders elsewhere. Defence and medical customers compete for scarce output, exposing the difference between technological ownership and physical resilience. Joint grid restoration and reserve factories could limit the crisis; by 2035 the weakest utility connection has become a strategic planning issue.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://op.europa.eu/o/opportal-service/download-handler?identifier=f135ce84-d8c8-11f1-8501-01aa75ed71a1&amp;format=pdf&amp;language=en&amp;productionSystem=cellar&amp;part=" rel="noopener" target="_blank">European Environment Agency (2026-11-03)</a>; <a href="https://doi.org/10.1016/j.ocecoaman.2026.108355" rel="noopener" target="_blank">Ocean &amp; Coastal Management (2026-09-05)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Licensing designs funds a targeted European manufacturing base</h4><p>European chip and equipment designers licence products to dependable foreign manufacturers, with contracts requiring knowledge transfer and a small EU backup line. Licence income finances engineering and training rather than duplicating every factory. Over several years Europe gains a limited production reserve and remains open to external innovation. The upside depends on enforceable contracts and careful selection of what must remain controllable during political disputes.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13563467.2026.2751102" rel="noopener" target="_blank">New Political Economy (2026-10-30)</a>; <a href="https://www.businesseurope.eu/wp-content/uploads/2026/10/2026-10-27-Priorities-for-European-startups-and-scaleups.pdf" rel="noopener" target="_blank">BusinessEurope (2026-10-27)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Export controls protect a niche while mass production moves away</h4><p>European governments tighten rules around a small class of sensitive design technology. Firms retain control of know-how, but some overseas customers shift orders to suppliers without the same restrictions. A few protected firms thrive on public demand, while adjacent manufacturing loses scale. The 2035 result is selective security with a narrower industrial ecosystem. Whether it works depends on whether the protected technology is genuinely difficult to replace.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://ecipe.org/publications/forward-looking-agenda-for-eu-quantum-policy/#_ftnref5" rel="noopener" target="_blank">ECIPE (2026-10-26)</a>; <a href="https://doi.org/10.1080/13501763.2026.2710717" rel="noopener" target="_blank">Journal of European Public Policy (2026-08-01)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Technology autonomy becomes a costly symbol without capacity</h4><p>Public agencies celebrate owning a critical design, yet there is no domestic supply chain to produce or repair enough units. A foreign manufacturing partner gains leverage over schedules and component substitutions. Taxpayers pay for repeated emergency orders, while private firms avoid investing because demand is unpredictable. This risk illustrates that legal control of technology must be paired with economically viable delivery capacity; otherwise the label of independence hides an operational dependency.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13501763.2026.2710717" rel="noopener" target="_blank">Journal of European Public Policy (2026-08-01)</a>; <a href="https://doi.org/10.1111/eulj.70030" rel="noopener" target="_blank">European Law Journal (2026-10-15)</a> · The 2035 development is hypothetical.</p></article></div></section></div></template><template id="manual-world-connected_growth">
<section class="scenario-hero"><p class="coords">Deep capacity / more buffers · More connected / open</p><h1>Connected Growth</h1><p class="scenario-tagline">Strong European capacity within open international networks</p><p class="scenario-summary">By 2035 Europe has competitive production, finance and research systems while global trade and investment remain comparatively open. Governments have repaired some internal market barriers without trying to replace every foreign supplier. External links supply ideas and affordable inputs; home-grown capacity gives Europeans choices if a partner becomes unreliable. This future assumes rules-based cooperation survives political tensions and that firms can scale across the EU. A large trade rupture or chronic under-investment could push Europe into another world.</p><p class="scenario-tradeoff"><strong>Core trade-off:</strong> Openness generates productivity and mutual restraint, but reliable access still depends on firms, governments and infrastructure outside Europe.</p></section>
<section aria-label="Sub-scenario matrix" class="scenario-frame sub-frame"><div class="frame-intro"><p class="taxonomy-kicker">What could make this world develop differently</p><h2>Inside Connected Growth</h2><p class="future-lede">The evidence includes formal Mercosur market access, qualified trade diversion, EU technology investment gaps, partnership implementation and cross-border digital dependence. The two internal questions are whether Europe controls vital technology and whether trade partners are truly diversified.</p></div><div class="scenario-matrix-wrap"><div class="axis-y-high">European technology control</div><div class="axis-y-title">Control of critical technology</div><div class="scenario-matrix"><article class="scenario-cell sub-cell"><a href="#sub-1"><div><p class="cell-axis">Partner diversification: Narrow partners · Control of critical technology: Tech control</p><h2>Tech control + Narrow partners</h2><p>European industry controls many of its critical designs, but export and sourcing relationships remain concentrated in a few large partners. Open trade makes this efficient while relations are calm. A dispute with one partner could still affect a surprising number of otherwise successful Europea…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-2"><div><p class="cell-axis">Partner diversification: Diversified partners · Control of critical technology: Tech control</p><h2>Tech control + Diversified partners</h2><p>Europe controls strategic technologies and works with a wide range of reliable partners. This is the most flexible path, but diversity must be real: a dozen suppliers may still use one processor, payment network or licence provider. Europe can be confident without closing its market because alt…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-3"><div><p class="cell-axis">Partner diversification: Narrow partners · Control of critical technology: Tech dependence</p><h2>Tech dependence + Narrow partners</h2><p>European industry is productive and global links are open, but advanced software, equipment and digital services are sourced mainly from a narrow foreign partner group. Commercial benefits are real; European policymakers worry about the price of an unexpected access restriction. Fallback planni…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-4"><div><p class="cell-axis">Partner diversification: Diversified partners · Control of critical technology: Tech dependence</p><h2>Tech dependence + Diversified partners</h2><p>Europe has strong industrial and financial capacity and buys many advanced technologies from abroad, but its partners are well diversified. Access to a range of sources brings efficiency and flexibility. The remaining vulnerabilities are shared service platforms or upstream suppliers hidden beh…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article></div><div class="axis-y-low">External technology dependence</div><div class="axis-x"><b>Partner diversification</b></div><div class="axis-x-labels"><span>Narrow / concentrated partners</span><span>Broad / diversified partners</span></div></div></section>
<section class="sub-details-intro"><p class="taxonomy-kicker">What could happen next</p><h2>Four ways each path could develop</h2><p>Each path keeps the world assumptions and its own two axes. The four variants below test a distinct hypothetical disruption, achievable opening, gradual development and risk. They are alternative conditions, not four things predicted to happen together.</p></section>
<div class="sub-details"><section class="sub-detail" id="sub-1"><div class="sub-detail-head"><p class="sub-number">01</p><div><h3>Tech control + Narrow partners</h3><p>European industry controls many of its critical designs, but export and sourcing relationships remain concentrated in a few large partners. Open trade makes this efficient while relations are calm. A dispute with one partner could still affect a surprising number of otherwise successful European factories. The strategic task is to preserve good relations without letting them become a single point of failure.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>A major partner changes its technical standards overnight</h4><p>In 2032 a large friendly market abruptly requires a different certification regime for industrial equipment. European exporters own their technology and have strong factories, yet must rerun expensive tests to keep selling. Firms with several customers recover quickly; those focused on one partner face layoffs. EU negotiators seek mutual recognition instead of retaliatory closure. The disruption tests whether open relationships have enforceable institutions, not whether all foreign connections are dangerous.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1093/jiel/jgag030" rel="noopener" target="_blank">Journal of International Economic Law (2026-09-26)</a>; <a href="https://egmontinstitute.be/india-eu-strategic-partnership-still-a-long-way-to-go/" rel="noopener" target="_blank">Egmont Institute (2026-11-03)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>A reciprocal chip agreement widens a narrow market</h4><p>European design and equipment firms negotiate predictable export permits and shared maintenance standards with a key technological partner. The agreement lets specialised European production reach enough customers to remain economical while maintaining checks on sensitive uses. By 2035 companies spend less time anticipating licence surprises and more on production. The gain depends on an actual enforceable arrangement; friendly diplomatic language alone would not remove foreign authorities’ power over licences.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13563467.2026.2751102" rel="noopener" target="_blank">New Political Economy (2026-10-30)</a>; <a href="https://data.consilium.europa.eu/doc/document/ST-15512-2026-INIT/en/pdf" rel="noopener" target="_blank">European Economic and Social Committee (2026-10-21)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>A few export hubs become extraordinarily productive</h4><p>European advanced manufacturers expand around well-connected ports, labs and partner investment networks. Their large overseas customer base sustains research and lowers unit costs, creating more EU jobs. But regional concentration deepens, and smaller Member States demand a share of supplier contracts. The trend remains compatible with European capacity until over-reliance on one market undermines bargaining freedom. Cross-border training and component sourcing determine whether growth spreads.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13563467.2026.2676621" rel="noopener" target="_blank">New Political Economy (2026-05-25)</a>; <a href="https://news.google.com/rss/articles/CBMickFVX3lxTE9TSkhHTWExVWNYeHFvbHM5UnZMU1Fqdi1sU1g5WVRXX3V3ZzhPVWtXS21hRzRKVGZISjhSSVZnNG1aYUR3WVdIb2llbWNFRVVHb094QmUya19lLUFTZEdFbEowYWZ4SjJWV29fc0JpeFhWZw?oc=5" rel="noopener" target="_blank">European Commission / DG Research and Innovation (2026-10-01)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>A close partner becomes too essential to challenge</h4><p>EU firms rely on one major market for sales, cloud tools and advanced components. When a dispute emerges, officials hesitate to enforce a legitimate rule for fear of retaliation against several industries at once. Both sides benefit from trade, but their exposure is asymmetric. Diversifying customers and retaining tested domestic substitutes would restore choice; simply owning technology in Europe does not remove concentrated demand or service dependence.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13563467.2026.2751103" rel="noopener" target="_blank">New Political Economy (2026-10-28)</a>; <a href="https://news.google.com/rss/articles/CBMiigFBVV95cUxPcFlSWTFNSXJsdm1ETFp6eS1IZkIwblpHZk55NS02TG9kQUVXNE1vUV9FajhDTVJTNkRFcnZpa3Z6V3JiWXd4WjVqU3BXMjZacFR3bVdudnJWdnR4RGJxU0FJTmFQMHBUbVkwdDdCQ09hZVVULVFENW1IVmxKSWd5WXJLeTJ6NWZNLVE?oc=5" rel="noopener" target="_blank">ECB (2026-10-01)</a> · The 2035 development is hypothetical.</p></article></div></section><section class="sub-detail" id="sub-2"><div class="sub-detail-head"><p class="sub-number">02</p><div><h3>Tech control + Diversified partners</h3><p>Europe controls strategic technologies and works with a wide range of reliable partners. This is the most flexible path, but diversity must be real: a dozen suppliers may still use one processor, payment network or licence provider. Europe can be confident without closing its market because alternative relationships and domestic capabilities reinforce one another.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>A global payment outage tests diversified trade</h4><p>In 2031 a cyber failure affects a dominant international settlement channel while European manufacturers have goods moving on many routes. Production continues, but merchants cannot receive some payments and cargo paperwork stalls. European payment schemes and banks activate interoperable alternatives previously tested with partners. If adoption remains shallow, trade still slows. The episode shows why the financial layer matters to a highly connected manufacturing economy.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://news.google.com/rss/articles/CBMirAFBVV95cUxQeG5NdWJWVk5uRzBhQmVubk5EMHptbUFseEktd285WGxRY241QjJJdVFHOHMwU25OSW5OTnY3UHJwWG5yRWNiZ3dKV2NfTFR6anRNaGxBenZZYlNDWjNISW9CRkFlenN6VzY1cjJ5NHQ2M21nOVplWDRnRlZKVUkxUW5YdVZSSXRsa003VlBrVmtqaVpkMXZ3bUxmZHktemNUWl9XLXdNaHo2SmVv?oc=5" rel="noopener" target="_blank">Reuters (2026-09-30)</a>; <a href="https://news.google.com/rss/articles/CBMiigFBVV95cUxPcFlSWTFNSXJsdm1ETFp6eS1IZkIwblpHZk55NS02TG9kQUVXNE1vUV9FajhDTVJTNkRFcnZpa3Z6V3JiWXd4WjVqU3BXMjZacFR3bVdudnJWdnR4RGJxU0FJTmFQMHBUbVkwdDdCQ09hZVVULVFENW1IVmxKSWd5WXJLeTJ6NWZNLVE?oc=5" rel="noopener" target="_blank">ECB (2026-10-01)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>European clean-technology standards become a shared service</h4><p>EU standards organisations and several trade partners jointly certify industrial emissions and technology security. European firms sell testing and engineering services, while imported low-carbon components remain affordable. That generates income and makes EU rules influential without excluding otherwise reliable foreign producers. The gain requires trust in audits and equal treatment of equivalent outcomes; if the EU demands compliance without partner participation, the same standard could become a barrier.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1093/jiel/jgag030" rel="noopener" target="_blank">Journal of International Economic Law (2026-09-26)</a>; <a href="https://doi.org/10.1038/s41558-026-02607-y" rel="noopener" target="_blank">Nature Climate Change (2026-06-08)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Alternative sources become a normal part of industrial purchasing</h4><p>European procurement teams stop treating diversification as an emergency exercise and routinely use qualified suppliers in multiple markets. Domestic factories remain strong because demand is stable, while imports keep prices competitive. Over a decade this makes small political disputes easier to absorb. The trend depends on testing upstream ownership and critical inputs; if supposedly different suppliers share one hidden processing bottleneck, the resilience is overstated.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.erss.2026.105047" rel="noopener" target="_blank">Energy Research &amp; Social Science (2026-10-29)</a>; <a href="https://doi.org/10.1111/roie.70080" rel="noopener" target="_blank">Review of International Economics (2026-08-05)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>The open innovation network quietly transfers irreplaceable know-how</h4><p>Some foreign partnerships give a business access to research but also require disclosure of control software or techniques that Europe cannot easily replace. A firm may gain profitable sales now while losing future bargaining power. Targeted contract terms and sensitive-technology checks can reduce this risk without banning broad research ties. In this path, the hardest task is deciding which knowledge genuinely creates non-substitutable leverage and which open exchange remains mutually beneficial.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://ecipe.org/publications/forward-looking-agenda-for-eu-quantum-policy/#_ftnref5" rel="noopener" target="_blank">ECIPE (2026-10-26)</a>; <a href="https://joint-research-centre.ec.europa.eu/scientific-activities/security-research-innovation-campus_en" rel="noopener" target="_blank">Joint Research Centre (2026-07-20)</a> · The 2035 development is hypothetical.</p></article></div></section><section class="sub-detail" id="sub-3"><div class="sub-detail-head"><p class="sub-number">03</p><div><h3>Tech dependence + Narrow partners</h3><p>European industry is productive and global links are open, but advanced software, equipment and digital services are sourced mainly from a narrow foreign partner group. Commercial benefits are real; European policymakers worry about the price of an unexpected access restriction. Fallback planning is more realistic than total duplication of these sophisticated systems.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>A foreign AI licence interruption reaches public services</h4><p>In 2030 a leading external model provider suspends a class of European accounts after a regulatory dispute. Hospitals and municipal offices with no alternative provider lose routine services, although banks with rehearsed fallbacks maintain operations. The ECB’s earlier warning was not proof of a system-wide crisis; this conditional world shows how concentration could amplify one. Europe's domestic production base cushions physical losses but cannot replace an inaccessible service overnight.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://news.google.com/rss/articles/CBMiigFBVV95cUxPcFlSWTFNSXJsdm1ETFp6eS1IZkIwblpHZk55NS02TG9kQUVXNE1vUV9FajhDTVJTNkRFcnZpa3Z6V3JiWXd4WjVqU3BXMjZacFR3bVdudnJWdnR4RGJxU0FJTmFQMHBUbVkwdDdCQ09hZVVULVFENW1IVmxKSWd5WXJLeTJ6NWZNLVE?oc=5" rel="noopener" target="_blank">ECB (2026-10-01)</a>; <a href="https://data.consilium.europa.eu/doc/document/ST-10476-2026-ADD-23-REV-1/en/pdf" rel="noopener" target="_blank">Council of the European Union (2026-11-10)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Foreign investment scales European AI on protected access terms</h4><p>A large overseas investor finances European data and software facilities under contracts requiring data portability, local incident response and independent operational backups. European customers benefit from global expertise while retaining a usable exit route. The opportunity becomes visible only when switching tests succeed, not when the investment is announced. Clear screening, competition and privacy rules keep access dependable without pretending Europe can build every technology itself.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://celis.institute/beyond-the-individual-transaction-risk-assessments-under-article-194-of-regulation-eu-2026-1386/#download-pdf" rel="noopener" target="_blank">CELIS Institute (2026-10-22)</a>; <a href="https://news.google.com/rss/articles/CBMiigFBVV95cUxPcFlSWTFNSXJsdm1ETFp6eS1IZkIwblpHZk55NS02TG9kQUVXNE1vUV9FajhDTVJTNkRFcnZpa3Z6V3JiWXd4WjVqU3BXMjZacFR3bVdudnJWdnR4RGJxU0FJTmFQMHBUbVkwdDdCQ09hZVVULVFENW1IVmxKSWd5WXJLeTJ6NWZNLVE?oc=5" rel="noopener" target="_blank">ECB (2026-10-01)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>High growth continues through imported specialised technology</h4><p>Europe's manufacturing and services expand by buying best-in-class overseas tools. Firms become world leaders in the products assembled around them, even as few Europeans can service certain proprietary components. This arrangement delivers real income and productivity in an open world, so the dependency is not automatically harmful. It becomes a strategic problem only if the partner acquires the ability and incentive to withdraw access at acceptable cost to itself.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13501763.2026.2710717" rel="noopener" target="_blank">Journal of European Public Policy (2026-08-01)</a>; <a href="https://doi.org/10.1080/13563467.2026.2751103" rel="noopener" target="_blank">New Political Economy (2026-10-28)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Shared exposure turns a bilateral quarrel into a common EU cost</h4><p>A dispute about export controls with one partner affects chip tools, bank AI models and several manufacturing supply chains simultaneously. Strong European factories cannot keep operating where licences and online services stop. Governments disagree about retaliation because businesses depend on the partner to different degrees. The risk grows with the overlap of contracts across sectors; multi-provider plans and coordinated diplomacy might stop a commercial disagreement becoming a continental shock.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13563467.2026.2751102" rel="noopener" target="_blank">New Political Economy (2026-10-30)</a>; <a href="https://news.google.com/rss/articles/CBMiigFBVV95cUxPcFlSWTFNSXJsdm1ETFp6eS1IZkIwblpHZk55NS02TG9kQUVXNE1vUV9FajhDTVJTNkRFcnZpa3Z6V3JiWXd4WjVqU3BXMjZacFR3bVdudnJWdnR4RGJxU0FJTmFQMHBUbVkwdDdCQ09hZVVULVFENW1IVmxKSWd5WXJLeTJ6NWZNLVE?oc=5" rel="noopener" target="_blank">ECB (2026-10-01)</a> · The 2035 development is hypothetical.</p></article></div></section><section class="sub-detail" id="sub-4"><div class="sub-detail-head"><p class="sub-number">04</p><div><h3>Tech dependence + Diversified partners</h3><p>Europe has strong industrial and financial capacity and buys many advanced technologies from abroad, but its partners are well diversified. Access to a range of sources brings efficiency and flexibility. The remaining vulnerabilities are shared service platforms or upstream suppliers hidden behind apparently separate trading relationships.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>Incompatible carbon data halt trade between open partners</h4><p>A major trade partner changes emissions-verification rules while the EU demands its own reporting format. Material still exists and tariffs are modest, but firms cannot prove compliance in time. European factories slow as shipments wait for certificates. Joint auditing and mutual recognition resolve the problem in some sectors; others lose buyers. This future shock reveals that connected trade depends on administrative compatibility as well as ships and factories.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1093/jiel/jgag030" rel="noopener" target="_blank">Journal of International Economic Law (2026-09-26)</a>; <a href="https://doi.org/10.1038/s41558-026-02607-y" rel="noopener" target="_blank">Nature Climate Change (2026-06-08)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Supplier trials make trusted-partner diversity productive</h4><p>European buyers finance pre-qualified alternative component lines in multiple partner countries, with a small domestic reserve. Because the contracts share technical standards, factories can switch quickly without lowering safety. The gain reduces the need for huge emergency inventories and lets partners share investment benefits. It requires auditing upstream processors and not mistaking several distributor logos for different actual sources. Competition keeps the network from becoming a closed bloc.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.erss.2026.105047" rel="noopener" target="_blank">Energy Research &amp; Social Science (2026-10-29)</a>; <a href="https://op.europa.eu/o/opportal-service/download-handler?identifier=0f50df8f-ce36-11f1-9458-01aa75ed71a1&amp;format=pdf&amp;language=en&amp;productionSystem=cellar&amp;part=" rel="noopener" target="_blank">Publications Office of the EU (2026-10-22)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Diversification and domestic scale reinforce each other</h4><p>Firms combine European assembly and design with competitive suppliers in Africa, Latin America and Asia. New trade agreements gradually become real production contracts rather than diplomatic headlines. Imports lower costs while EU plants maintain enough skilled capacity to handle interruptions. The trend is uneven: logistics, local skills and investment protection decide where it succeeds. Its strength is the ability to change trading relationships without sacrificing most production.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://op.europa.eu/o/opportal-service/download-handler?identifier=0f50df8f-ce36-11f1-9458-01aa75ed71a1&amp;format=pdf&amp;language=en&amp;productionSystem=cellar&amp;part=" rel="noopener" target="_blank">Publications Office of the EU (2026-10-22)</a>; <a href="https://ecipe.org/publications/from-periphery-to-power/#_ftnref1" rel="noopener" target="_blank">ECIPE (2026-07-13)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Apparently independent cloud suppliers share the same foundation</h4><p>European firms contract with several regional cloud and AI service resellers, believing they have backup capacity. During a foreign model-access dispute, all resellers lose the same underlying service. Strong EU manufacturing provides little immediate help to banks and administrative systems. The risk can be reduced through tests that trace dependencies to the actual model, network and legal owner rather than the visible European contractor.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://news.google.com/rss/articles/CBMiigFBVV95cUxPcFlSWTFNSXJsdm1ETFp6eS1IZkIwblpHZk55NS02TG9kQUVXNE1vUV9FajhDTVJTNkRFcnZpa3Z6V3JiWXd4WjVqU3BXMjZacFR3bVdudnJWdnR4RGJxU0FJTmFQMHBUbVkwdDdCQ09hZVVULVFENW1IVmxKSWd5WXJLeTJ6NWZNLVE?oc=5" rel="noopener" target="_blank">ECB (2026-10-01)</a>; <a href="https://data.consilium.europa.eu/doc/document/ST-10476-2026-ADD-23-REV-1/en/pdf" rel="noopener" target="_blank">Council of the European Union (2026-11-10)</a> · The 2035 development is hypothetical.</p></article></div></section></div></template><template id="manual-world-constrained_europe">
<section class="scenario-hero"><p class="coords">Thin capacity / few buffers · More fragmented / guarded</p><h1>Constrained Europe</h1><p class="scenario-tagline">Weak buffers behind guarded international markets</p><p class="scenario-summary">By 2035 fragmented international trade coincides with weak European industrial and financial capacity. Governments use controls to protect a few critical activities but cannot fund enough alternatives. Businesses face scarce inputs, expensive energy and uncertain export markets. This world becomes plausible if protection expands faster than investment, if EU states compete instead of coordinating, and if alternative partners remain difficult to use. It is not inevitable: common financing, practical trade agreements or falling energy costs could move Europe away from it.</p><p class="scenario-tradeoff"><strong>Core trade-off:</strong> Guarding a small industrial base protects selected capabilities while high costs and limited choice reduce prosperity and policy freedom.</p></section>
<section aria-label="Sub-scenario matrix" class="scenario-frame sub-frame"><div class="frame-intro"><p class="taxonomy-kicker">What could make this world develop differently</p><h2>Inside Constrained Europe</h2><p class="future-lede">Studies of concentrated raw materials, uneven industrial subsidies, hydrogen costs and infrastructure vulnerabilities make these stress tests relevant. The internal axes ask whether vital inputs can be replaced and whether Europe has affordable, reliable energy.</p></div><div class="scenario-matrix-wrap"><div class="axis-y-high">Secure / flexible energy</div><div class="axis-y-title">Energy-system resilience</div><div class="scenario-matrix"><article class="scenario-cell sub-cell"><a href="#sub-1"><div><p class="cell-axis">Critical-input resilience: Input exposure · Energy-system resilience: Energy resilience</p><h2>Energy resilience + Input exposure</h2><p>European electricity and heat systems remain sufficiently reliable, but key industrial materials come from a few foreign sources in a guarded trade environment. Security of power alone cannot guarantee factory output. Policymakers have to decide which material bottlenecks justify investment whe…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-2"><div><p class="cell-axis">Critical-input resilience: Input resilience · Energy-system resilience: Energy resilience</p><h2>Energy resilience + Input resilience</h2><p>European energy and critical inputs are comparatively resilient despite guarded trade, but factories, finance and market access are still thin. Recycling and domestic energy provide a floor rather than an engine of growth. Without industrial orders, firms cannot fully use the resources they sec…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-3"><div><p class="cell-axis">Critical-input resilience: Input exposure · Energy-system resilience: Energy constraint</p><h2>Energy constraint + Input exposure</h2><p>Europe is exposed to scarce foreign inputs and unreliable energy while guarded trade cuts off easy substitutes. Governments face painful decisions about allocating essential resources among households, hospitals and factories. A crisis can spread rapidly because industrial networks contain few…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-4"><div><p class="cell-axis">Critical-input resilience: Input resilience · Energy-system resilience: Energy constraint</p><h2>Energy constraint + Input resilience</h2><p>Europe secures some crucial raw materials through recycling and domestic processing, but energy shortages continue to disrupt production in a guarded world. Material stocks are useful only when electricity, transport and finance allow factories to use them. A policy focused exclusively on mines…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article></div><div class="axis-y-low">Constrained / volatile energy</div><div class="axis-x"><b>Critical-input resilience</b></div><div class="axis-x-labels"><span>Concentrated / brittle inputs</span><span>Diversified / buffered inputs</span></div></div></section>
<section class="sub-details-intro"><p class="taxonomy-kicker">What could happen next</p><h2>Four ways each path could develop</h2><p>Each path keeps the world assumptions and its own two axes. The four variants below test a distinct hypothetical disruption, achievable opening, gradual development and risk. They are alternative conditions, not four things predicted to happen together.</p></section>
<div class="sub-details"><section class="sub-detail" id="sub-1"><div class="sub-detail-head"><p class="sub-number">01</p><div><h3>Energy resilience + Input exposure</h3><p>European electricity and heat systems remain sufficiently reliable, but key industrial materials come from a few foreign sources in a guarded trade environment. Security of power alone cannot guarantee factory output. Policymakers have to decide which material bottlenecks justify investment when money and outside market access are limited.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>A single alloy restriction idles factories with available power</h4><p>In 2032 a foreign processor suspends exports of an input essential to electric motors. European grid capacity is adequate, yet machinery lines cannot run. Governments discover they subsidised energy infrastructure without building material reserves or qualified alternatives. Some producers redesign with lower-performance substitutes, while others close. If the restriction lifts early, job losses are limited; a long interruption reveals how a single missing metal can defeat otherwise reliable domestic utilities.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.erss.2026.105047" rel="noopener" target="_blank">Energy Research &amp; Social Science (2026-10-29)</a>; <a href="https://doi.org/10.1016/j.resconrec.2026.109158" rel="noopener" target="_blank">Resources Conservation and Recycling (2026-09-19)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Efficiency upgrades reduce industrial import exposure</h4><p>With public budgets tight, several regions focus on reducing the energy used per tonne of industrial output. Cheaper, more reliable local electricity makes recycling and remanufacturing profitable in selected industries. This does not solve the remaining foreign material bottleneck, but it gives firms more cash to build small inventories and qualify substitutes. By 2035 incremental improvements avert some closures without requiring a vast national production programme.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.crsus.2026.100871" rel="noopener" target="_blank">Cell Reports Sustainability (2026-10-01)</a>; <a href="https://doi.org/10.1016/j.jclepro.2026.149847" rel="noopener" target="_blank">Journal of Cleaner Production (2026-11-04)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Electrification survives while equipment components remain scarce</h4><p>Energy investments made earlier continue to deliver dependable power despite weakened international markets. Factories gradually switch away from imported fossil fuel use, reducing one political exposure. Yet repair parts and specialty minerals arrive only through restricted channels, so new installations are expensive. The trend helps consumers and industrial energy security but is insufficient to restore Europe’s full manufacturing capacity. The difference between power resilience and material resilience remains visible.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://energy.ec.europa.eu/publications/proposal-regulation-phasing-out-russian-gas-imports-and-improving-monitoring-potential-energy_en" rel="noopener" target="_blank">European Commission — Energy (2025-06-17)</a>; <a href="https://doi.org/10.1016/j.erss.2026.105047" rel="noopener" target="_blank">Energy Research &amp; Social Science (2026-10-29)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>An energy success masks the decline of industrial capability</h4><p>EU governments point to reliable electricity as proof that autonomy works, while manufacturers leave because they cannot buy competitive components or export finished products. Public budgets are committed to energy infrastructure and have little room to support essential processing. The danger is diagnostic: one improved dependency can hide another that determines actual production. Europe can avoid this through factory-level outcome measures rather than celebrating a single security indicator.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13501763.2026.2710717" rel="noopener" target="_blank">Journal of European Public Policy (2026-08-01)</a>; <a href="https://doi.org/10.1111/roie.70080" rel="noopener" target="_blank">Review of International Economics (2026-08-05)</a> · The 2035 development is hypothetical.</p></article></div></section><section class="sub-detail" id="sub-2"><div class="sub-detail-head"><p class="sub-number">02</p><div><h3>Energy resilience + Input resilience</h3><p>European energy and critical inputs are comparatively resilient despite guarded trade, but factories, finance and market access are still thin. Recycling and domestic energy provide a floor rather than an engine of growth. Without industrial orders, firms cannot fully use the resources they secured.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>A credit squeeze halts a rare but viable European materials plant</h4><p>In 2030 a banking shock raises borrowing costs for small specialist manufacturers. A European rare-earth recovery plant has local feedstock and electricity but cannot finance working capital or new equipment. Buyers return to expensive imports, reducing the value of earlier recycling investments. The shock is financial rather than a foreign embargo. EU credit guarantees could keep essential operations alive, but only if policymakers can distinguish commercially sound plants from projects without lasting demand.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.jclepro.2026.149847" rel="noopener" target="_blank">Journal of Cleaner Production (2026-11-04)</a>; <a href="https://www.businesseurope.eu/wp-content/uploads/2026/10/2026-10-27-Priorities-for-European-startups-and-scaleups.pdf" rel="noopener" target="_blank">BusinessEurope (2026-10-27)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Niche materials become valuable exports even in a guarded world</h4><p>European recovery businesses standardise high-quality recycled magnet materials and sell them to the few outside partners with compatible industrial rules. Export revenue sustains skilled jobs and pays for better collection systems. The opportunity is modest, not a continent-wide industrial renaissance. It requires reliable recycled quality and practical certification, and it could disappear if trade partners close their markets or product designs stop using the recovered materials.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.jclepro.2026.149847" rel="noopener" target="_blank">Journal of Cleaner Production (2026-11-04)</a>; <a href="https://doi.org/10.1016/j.resconrec.2026.109158" rel="noopener" target="_blank">Resources Conservation and Recycling (2026-09-19)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Selective circular production holds a thin industrial core together</h4><p>Companies conserve critical metals, repair motors and recover parts because importing replacements has become costly. Local collection systems and stable energy keep certain industries operating, although volumes remain below those of globally integrated competitors. The trend strengthens resilience at a small scale but lowers product choice and may raise prices. By 2035 circularity functions as a practical survival tool rather than a guarantee of industrial leadership.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1007/s40831-026-01716-4" rel="noopener" target="_blank">Journal of Sustainable Metallurgy (2026-10-23)</a>; <a href="https://doi.org/10.1016/j.jclepro.2026.149847" rel="noopener" target="_blank">Journal of Cleaner Production (2026-11-04)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Protected input supplies attract too little manufacturing demand</h4><p>Europe builds a strategically valuable recovery facility but fails to attract enough downstream firms to buy its products. The plant needs continued subsidies and cannot reach efficient scale. No external blockade caused the loss: the industrial ecosystem and market incentives are missing. Policymakers can reduce this risk with binding customer trials and contracts, but guaranteeing purchases indefinitely could deepen the fiscal squeeze of a constrained world.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1080/13563467.2026.2676621" rel="noopener" target="_blank">New Political Economy (2026-05-25)</a>; <a href="https://doi.org/10.1007/s40831-026-01716-4" rel="noopener" target="_blank">Journal of Sustainable Metallurgy (2026-10-23)</a> · The 2035 development is hypothetical.</p></article></div></section><section class="sub-detail" id="sub-3"><div class="sub-detail-head"><p class="sub-number">03</p><div><h3>Energy constraint + Input exposure</h3><p>Europe is exposed to scarce foreign inputs and unreliable energy while guarded trade cuts off easy substitutes. Governments face painful decisions about allocating essential resources among households, hospitals and factories. A crisis can spread rapidly because industrial networks contain few spare parts and public finances have limited room for emergency support.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>Drought and port damage trigger a three-network shutdown</h4><p>In 2031 low river levels restrict inland freight as extreme heat damages electricity equipment near a manufacturing zone. Critical components cannot be rerouted because foreign supply is concentrated and borders are guarded. A temporary power shortage turns into weeks of industrial stoppages. The scenario combines weather pathways documented earlier, but not an observed continent-wide cascade. Regional backup electricity and pre-arranged road capacity could prevent the worst outcome.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://op.europa.eu/o/opportal-service/download-handler?identifier=f135ce84-d8c8-11f1-8501-01aa75ed71a1&amp;format=pdf&amp;language=en&amp;productionSystem=cellar&amp;part=" rel="noopener" target="_blank">European Environment Agency (2026-11-03)</a>; <a href="https://doi.org/10.1016/j.ocecoaman.2026.108355" rel="noopener" target="_blank">Ocean &amp; Coastal Management (2026-09-05)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Emergency load-sharing prevents a regional industrial collapse</h4><p>Neighbouring EU regions agree in advance which substations, rail systems and essential manufacturing lines must retain power during shortages. Coordinated grid restoration and temporary freight diversions allow some factories to avoid permanent closure. Citizens still pay a high price and not every business can be saved. The opportunity is credible because it relies on planning and shared physical resources rather than suddenly creating new energy or mineral deposits.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://op.europa.eu/o/opportal-service/download-handler?identifier=f135ce84-d8c8-11f1-8501-01aa75ed71a1&amp;format=pdf&amp;language=en&amp;productionSystem=cellar&amp;part=" rel="noopener" target="_blank">European Environment Agency (2026-11-03)</a>; <a href="https://news.google.com/rss/articles/CBMijgJBVV95cUxPb0VFR0ZwY1pjVk51TDJyTEJHU0c1LVRJSDZUVXpKYVRHWHVFQzBseVJMOWNrVlBTMUY4WS1CV01STF9xWktEQnlWbXVGTUtGMEhqVVhrQ2hXS3hXUW55Z3NaR3JuamJCZzBUeHFyV1F1WTc5MzVaUzJkZEtJU3lGaUUwNUowLXBEYlF1djBGVWVYQjZMa0hibTBKOUZUVjNJNUo2aWVKZ3Bxc3lqajJYdWVDYmppOHFzdFZDd19OT3lwNFB4cjh0RHBCQ0FnX1VKRUxOUER5UE5tVVlOZ3VoMVhfcXhHTThXVHVaSlBUMWFYdUJMZVFCc2RaYUVLS3diQnFyQ2tlMnFEdXd0dlE?oc=5" rel="noopener" target="_blank">Le Monde (2026-09-03)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Short-term fuel substitution keeps services running at a cost</h4><p>Repeated supply stress leads governments to rely on a wider set of emergency fuels and local backup generation. Hospitals and rail communications operate, but energy becomes expensive and less climate-friendly. Industrial goods priced for global competition lose buyers. The trend buys time without providing an enduring development strategy. By 2035 the key question is whether emergency choices create a bridge to cleaner infrastructure or lock in costly systems.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://energy.ec.europa.eu/publications/proposal-regulation-phasing-out-russian-gas-imports-and-improving-monitoring-potential-energy_en" rel="noopener" target="_blank">European Commission — Energy (2025-06-17)</a>; <a href="https://doi.org/10.1016/j.enpol.2026.115634" rel="noopener" target="_blank">Energy Policy (2026-10-29)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Industrial flight accelerates the fiscal crisis</h4><p>Electricity interruptions reduce factory output; falling exports then weaken tax revenue; fewer public resources are available to repair the grid. The feedback loop turns a temporary infrastructure problem into a long-term economic-security problem. Firms that can relocate do so, while workers face concentrated job losses. Alternative freight and European emergency investment could break the loop, but they must arrive before suppliers and skilled labour leave permanently.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://op.europa.eu/o/opportal-service/download-handler?identifier=f135ce84-d8c8-11f1-8501-01aa75ed71a1&amp;format=pdf&amp;language=en&amp;productionSystem=cellar&amp;part=" rel="noopener" target="_blank">European Environment Agency (2026-11-03)</a>; <a href="https://doi.org/10.1111/eulj.70030" rel="noopener" target="_blank">European Law Journal (2026-10-15)</a> · The 2035 development is hypothetical.</p></article></div></section><section class="sub-detail" id="sub-4"><div class="sub-detail-head"><p class="sub-number">04</p><div><h3>Energy constraint + Input resilience</h3><p>Europe secures some crucial raw materials through recycling and domestic processing, but energy shortages continue to disrupt production in a guarded world. Material stocks are useful only when electricity, transport and finance allow factories to use them. A policy focused exclusively on mines or reserves therefore reaches its limit.</p></div></div><div class="leaf-grid"><article class="leaf-card"><p class="kind">Shock</p><h4>A heatwave disables facilities that hold protected mineral stocks</h4><p>A severe heatwave damages power systems at Europe's main specialised refinery and the nearby rail junction. Critical metal inventories remain physically available, but factories cannot process or deliver them. Government reserves offer no quick solution until electricity and logistics recover. This shock reveals a second bottleneck behind a successfully diversified mineral chain. Distributed processing and emergency power can reduce exposure, but are expensive in a low-capacity Europe.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://op.europa.eu/o/opportal-service/download-handler?identifier=f135ce84-d8c8-11f1-8501-01aa75ed71a1&amp;format=pdf&amp;language=en&amp;productionSystem=cellar&amp;part=" rel="noopener" target="_blank">European Environment Agency (2026-11-03)</a>; <a href="https://doi.org/10.1016/j.ocecoaman.2026.108355" rel="noopener" target="_blank">Ocean &amp; Coastal Management (2026-09-05)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Opportunity</p><h4>Small processing plants combine material recovery with flexible demand</h4><p>European regions connect metal-recycling facilities to flexible electricity contracts, allowing non-urgent processing to pause when the grid is stressed. Manufacturers hold pre-qualified supplies to bridge those pauses. This is an achievable adaptation, not a promise of abundant power. It requires coordination among recyclers, industrial users and grid operators, and the added inventory increases cost. By 2035 it permits limited output even when the energy system remains constrained.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.jclepro.2026.149847" rel="noopener" target="_blank">Journal of Cleaner Production (2026-11-04)</a>; <a href="https://doi.org/10.1016/j.enpol.2026.115634" rel="noopener" target="_blank">Energy Policy (2026-10-29)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Trend</p><h4>Domestic input recovery improves despite unreliable electricity</h4><p>Firms gradually shift from importing refined materials toward recovering metal from products already in Europe. That weakens some external leverage, but unpredictable energy costs keep processing plants small and costly. The trend is therefore one of relative security, not competitiveness: European businesses may have domestic materials but still struggle to sell affordable finished products. The deciding condition is whether grid and industrial investment eventually catch up.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.resconrec.2026.109158" rel="noopener" target="_blank">Resources Conservation and Recycling (2026-09-19)</a>; <a href="https://doi.org/10.1016/j.crsus.2026.100871" rel="noopener" target="_blank">Cell Reports Sustainability (2026-10-01)</a> · The 2035 development is hypothetical.</p></article><article class="leaf-card"><p class="kind">Risk</p><h4>Stored metals become a false signal of readiness</h4><p>Europe measures rising critical-material reserves and concludes that strategic autonomy is improving. During a factory outage, the reserves cannot be converted to usable components because processing and distribution lack backup power. Budget pressure then forces authorities to choose between keeping expensive stock and upgrading the network. The risk is strongest when policymakers track tonnes held instead of the entire chain from feedstock to an operating European customer.</p><p class="variant-source"><strong>Evidence anchors:</strong> <a href="https://doi.org/10.1016/j.erss.2026.105047" rel="noopener" target="_blank">Energy Research &amp; Social Science (2026-10-29)</a>; <a href="https://op.europa.eu/o/opportal-service/download-handler?identifier=f135ce84-d8c8-11f1-8501-01aa75ed71a1&amp;format=pdf&amp;language=en&amp;productionSystem=cellar&amp;part=" rel="noopener" target="_blank">European Environment Agency (2026-11-03)</a> · The 2035 development is hypothetical.</p></article></div></section></div></template><template id="manual-world-open_under_pressure">
<section class="scenario-hero"><p class="coords">Thin capacity / few buffers · More connected / open</p><h1>Open Under Pressure</h1><p class="scenario-tagline">Wide global access with insufficient European buffers</p><p class="scenario-summary">In 2035 the world economy remains relatively connected and Europe's consumers and firms can buy and sell widely, but many critical technologies, materials and financial services are controlled elsewhere. European investment and industrial capacity have not kept pace. Openness still provides affordable goods and international cooperation; it is not inherently a failure. The risk is that European actors cannot afford to refuse a coercive demand or withstand an abrupt loss of access. This world could change if Europe successfully mobilises capital and builds practical alternatives.</p><p class="scenario-tradeoff"><strong>Core trade-off:</strong> Growth from openness coexists with thin domestic fallback capacity, making freedom of action depend on relationships Europe does not wholly control.</p></section>
<section aria-label="Sub-scenario matrix" class="scenario-frame sub-frame"><div class="frame-intro"><p class="taxonomy-kicker">What could make this world develop differently</p><h2>Inside Open Under Pressure</h2><p class="future-lede">Investment-finance proposals, battery ownership studies, foreign AI access risks and trade-partner research anchor this world. The internal axes test whether enough capital can be mobilised and whether key material supplies are genuinely diversified.</p></div><div class="scenario-matrix-wrap"><div class="axis-y-high">Investment at scale</div><div class="axis-y-title">Strategic capital mobilisation</div><div class="scenario-matrix"><article class="scenario-cell sub-cell"><a href="#sub-1"><div><p class="cell-axis">Critical-input resilience: Input exposure · Strategic capital mobilisation: Capital at scale</p><h2>Capital at scale + Input exposure</h2><p>European banks and investors can finance new projects, but access to vital industrial materials remains concentrated abroad. Businesses have money to respond to shocks, yet new mines or processors cannot appear overnight. The challenge is to use abundant capital early enough to buy alternative…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-2"><div><p class="cell-axis">Critical-input resilience: Input resilience · Strategic capital mobilisation: Capital at scale</p><h2>Capital at scale + Input resilience</h2><p>Europe attracts large investment and has better access to critical inputs, although technology and production still depend heavily on international suppliers. Openness provides multiple ways to build capacity. The decisive question is whether capital produces usable European alternatives and sp…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-3"><div><p class="cell-axis">Critical-input resilience: Input exposure · Strategic capital mobilisation: Capital constraint</p><h2>Capital constraint + Input exposure</h2><p>Europe lacks strong capital mobilisation and remains exposed to concentrated critical inputs, but global markets are mostly accessible. Consumers benefit from imports while domestic firms struggle to finance alternative capacity. A shock need not close all trade: changing prices or shifting oth…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article><article class="scenario-cell sub-cell"><a href="#sub-4"><div><p class="cell-axis">Critical-input resilience: Input resilience · Strategic capital mobilisation: Capital constraint</p><h2>Capital constraint + Input resilience</h2><p>Europe has developed some protection against critical-input shortages but struggles to mobilise money for further industrial growth. Connected trade supplies affordable finished products and technology, while weak investment means domestic alternatives remain limited. The world is manageable wh…</p></div><span class="open-cue">See 4 detailed branches ↓</span></a></article></div><div class="axis-y-low">Capital constrained</div><div class="axis-x"><b>Critical-input resilience</b></div><div class="axis-x-labels"><span>Concentrated / brittle inputs</span><span>Diversified / buffered inputs</span></div></div></section>
<section class="sub-details-intro"><p class="taxonomy-kicker">What could happen next</p><h2>Four ways each path could develop</h2><p>Each path keeps the world assumptions and its own two axes. The four variants below test a distinct hypothetical disruption, achievable opening, gradual development and risk. They are alternative conditions, not four things predicted to happen together.</p></section>
