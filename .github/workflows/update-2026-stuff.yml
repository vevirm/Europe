name: Update 2026 Stuff

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'R&I Radar Scan'
      - 'Historical Top-Tier Scan'
      - 'Deep Scan V2 — Import Returned Results'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'radar.json'
      - 'radar_active.json'
      - 'historical/historical.json'
      - 'record_corrections.json'
      - 'scripts/generate_2026_stuff.py'

permissions:
  contents: write

concurrency:
  group: update-2026-stuff
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild 2026 publication data and Excel
        run: python scripts/generate_2026_stuff.py
      - name: Confirm outputs are present
        run: |
          test -s 2026-stuff/publications.json
          test -s 2026-stuff/2026_publications.xlsx
      - name: Commit updated 2026 outputs if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026-stuff/publications.json 2026-stuff/2026_publications.xlsx
          if git diff --cached --quiet; then
            echo '2026 Stuff is already current.'
            exit 0
          fi
          git commit -m 'Refresh 2026 Stuff publication register'
          # An independent scanner run may have committed while we generated.
          # Fail safely rather than overwriting or force-pushing concurrent changes.
          git push origin HEAD:main
